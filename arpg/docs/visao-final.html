<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark Noise · quadro-alvo</title>
<style>
@font-face { font-family: 'Orbitron'; src: url('../../assets/fonts/orbitron-var-latin.woff2') format('woff2'); font-weight: 400 900; }
@font-face { font-family: 'Space Mono'; src: url('../../assets/fonts/space-mono-400-latin.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'Space Mono'; src: url('../../assets/fonts/space-mono-700-latin.woff2') format('woff2'); font-weight: 700; }
html, body { margin: 0; background: #080d1c; }
canvas { display: block; width: 100vw; height: auto; max-height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<!-- Quadro-alvo do jogo final, na linguagem Aurora do arcade (a mesma do Jungle):
     cor contida, profundidade por névoa e camadas, uma luz quente que manda na cena
     e cor forte só no que é jogo (aviso, loot, dano). Tudo em Canvas 2D. -->
<canvas id="c" width="2400" height="1080"></canvas>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 2400, H = 1080;
let seed = 2611;
const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const R = (a, b) => a + rnd() * (b - a);

// Aurora: azul fundo, menta, lavanda, âmbar; coral só pra perigo
const A = {
  fundo: '#080D1C', fundo2: '#111D2C', menta: '#9BE7CE', lavanda: '#AFA3F5', ambar: '#E9B77C',
  coral: '#ED887F', texto: '#EDF4F0', suave: '#8E9AAF', sodio: '#F2C38B', raro: '#8FB8F0',
  asfalto: '#141B29', calcada: '#1B2333', fachada: ['#1C2536', '#212A3B', '#1A2232'], teto: '#111827',
};
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function luz(x, y, r, cor, a = 1, sy = 1, modo = 'lighter') {
  ctx.save(); ctx.globalCompositeOperation = modo; ctx.translate(x, y); ctx.scale(1, sy);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
  g.addColorStop(0, rgba(cor, a)); g.addColorStop(0.45, rgba(cor, a * 0.32)); g.addColorStop(1, rgba(cor, 0));
  ctx.fillStyle = g; ctx.fillRect(-r, -r, r * 2, r * 2); ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function poli(pts) { ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); }

const POSTES = [[430, 470], [1240, 470], [2110, 470]];   // luz de sódio: a luz principal da cena

// ── chão ───────────────────────────────────────────
function chao() {
  ctx.fillStyle = A.fundo; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = A.asfalto; ctx.fillRect(0, 500, W, 290); ctx.fillRect(1560, 0, 260, 500);
  for (let i = 0; i < 7000; i++) {
    ctx.fillStyle = rnd() < 0.5 ? 'rgba(237,244,240,0.018)' : 'rgba(0,0,0,0.16)';
    ctx.fillRect(R(0, W), R(0, H), R(1, 3), R(1, 2));
  }
  const calc = (x, y, w, h) => {
    ctx.fillStyle = A.calcada; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 2;
    for (let i = x; i < x + w; i += 52) { ctx.beginPath(); ctx.moveTo(i, y); ctx.lineTo(i, y + h); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(x, y + h / 2); ctx.lineTo(x + w, y + h / 2); ctx.stroke();
    ctx.fillStyle = '#262f42'; ctx.fillRect(x, y + h - 5, w, 5);   // meio-fio
  };
  calc(0, 436, 1560, 64); calc(1820, 436, 600, 64); calc(1500, 0, 60, 500); calc(1820, 0, 60, 500); calc(0, 790, W, 64);
  ctx.fillStyle = 'rgba(233,183,124,0.13)';
  for (let x = 20; x < W; x += 120) if (x < 1520 || x > 1860) ctx.fillRect(x, 642, 64, 5);
  ctx.fillStyle = 'rgba(237,244,240,0.05)';
  for (let x = 1580; x < 1800; x += 36) ctx.fillRect(x, 512, 18, 116);
  ctx.fillStyle = '#0d121d'; ctx.beginPath(); ctx.ellipse(610, 715, 34, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(237,244,240,0.07)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(610, 715, 26, 9, 0, 0, Math.PI * 2); ctx.stroke();
}

// poças: espelham a luz de sódio em riscos curtos
function pocas() {
  const lista = [[360, 580, 190, 30], [1180, 560, 160, 26], [1700, 520, 120, 44], [2060, 600, 210, 34], [820, 750, 170, 22], [1920, 745, 130, 18]];
  for (const [x, y, rx, ry] of lista) {
    ctx.fillStyle = '#0e1422'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.clip();
    for (const [px] of POSTES) {
      if (Math.abs(px - x) > rx + 60) continue;
      for (let k = 0; k < 9; k++) { ctx.fillStyle = rgba(A.sodio, R(0.08, 0.24)); const w = R(14, 60); ctx.fillRect(px - w / 2 + R(-14, 14), y - ry + R(0, ry * 2), w, R(1.5, 3)); }
    }
    ctx.fillStyle = 'rgba(175,163,245,0.06)'; ctx.fillRect(x - rx, y - ry, rx * 2, ry * 0.8);
    ctx.restore();
  }
}

// ── prédios ────────────────────────────────────────
function fachada(x, w, topo, base, op) {
  ctx.fillStyle = A.teto; ctx.fillRect(x, 0, w, topo);
  for (let i = 0; i < 3; i++) {
    const ax = x + R(30, w - 110), ay = R(10, Math.max(20, topo - 80));
    ctx.fillStyle = '#18202f'; rr(ax, ay, 74, 46, 3); ctx.fill();
    ctx.fillStyle = '#0d131f'; ctx.fillRect(ax, ay + 46, 74, 14);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2; for (let k = 8; k < 70; k += 9) { ctx.beginPath(); ctx.moveTo(ax + k, ay + 6); ctx.lineTo(ax + k, ay + 40); ctx.stroke(); }
  }
  ctx.fillStyle = '#28324a'; ctx.fillRect(x, topo - 5, w, 5);
  const g = ctx.createLinearGradient(0, topo, 0, base);
  g.addColorStop(0, op.cor); g.addColorStop(0.75, op.cor); g.addColorStop(1, '#151c2a');
  ctx.fillStyle = g; ctx.fillRect(x, topo, w, base - topo);
  for (let i = 0; i < 26; i++) { ctx.fillStyle = rgba('#000000', R(0.05, 0.14)); ctx.fillRect(x + R(0, w), topo + R(0, base - topo - 120), R(2, 5), R(30, 120)); }
  for (let y = topo + 72; y < base - 120; y += 72) { ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fillRect(x, y, w, 4); ctx.fillStyle = 'rgba(237,244,240,0.03)'; ctx.fillRect(x, y + 4, w, 2); }
  for (let y = topo + 18; y < base - 140; y += 72) for (let jx = x + 26; jx < x + w - 46; jx += 62) {
    const acesa = rnd() < 0.3;
    ctx.fillStyle = '#0c111c'; ctx.fillRect(jx - 3, y - 3, 42, 50);
    ctx.fillStyle = acesa ? rgba(rnd() < 0.8 ? A.ambar : A.menta, 0.22) : '#121a28'; ctx.fillRect(jx, y, 36, 44);
    if (acesa) { ctx.fillStyle = 'rgba(0,0,0,0.25)'; for (let b = 3; b < 44; b += 7) ctx.fillRect(jx, y + b, 36, 2); luz(jx + 18, y + 22, 50, A.ambar, 0.06); }
    if (rnd() < 0.3) { ctx.fillStyle = '#273047'; ctx.fillRect(jx + 2, y + 48, 32, 15); ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(jx + 4, y + 51, 28, 2); }
    if (rnd() < 0.2) { ctx.strokeStyle = 'rgba(237,244,240,0.12)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(jx - 6, y + 56); ctx.lineTo(jx + 44, y + 56); ctx.stroke(); }
  }
  const lt = base - 112;
  ctx.fillStyle = '#0b0f19'; ctx.fillRect(x, lt, w, 112);
  const n = op.lojas || 2, lw = w / n;
  for (let i = 0; i < n; i++) {
    const lx = x + i * lw + 16, ww = lw - 32, cor = op.luz[i % op.luz.length];
    const lg = ctx.createLinearGradient(0, lt + 18, 0, base);
    lg.addColorStop(0, rgba(cor, 0.06)); lg.addColorStop(1, rgba(cor, 0.24));
    ctx.fillStyle = lg; ctx.fillRect(lx, lt + 18, ww, 94);
    const meia = R(26, 64);
    ctx.fillStyle = '#1f2738'; ctx.fillRect(lx, lt + 18, ww, meia);
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; for (let b = 0; b < meia; b += 7) ctx.fillRect(lx, lt + 18 + b, ww, 2);
    ctx.fillStyle = 'rgba(8,13,28,0.75)';
    for (let k = 0; k < 4; k++) ctx.fillRect(lx + 10 + k * (ww - 30) / 3, base - R(20, 40), R(14, 24), 40);
    luz(lx + ww / 2, base + 26, ww * 0.6, cor, 0.16, 0.35, 'screen');
  }
  if (op.toldo) { ctx.fillStyle = op.toldo; ctx.fillRect(x + 10, lt - 12, w - 20, 14); ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x + 10, lt, w - 20, 4); }
}

// letreiro pintado à mão; só um ou outro acende, e fraco
function placa(txt, x, y, cor, tam, aceso, vertical) {
  ctx.save();
  ctx.font = `700 ${tam}px Orbitron`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const letras = vertical ? [...txt] : [txt];
  const w = vertical ? tam * 1.4 : ctx.measureText(txt).width + tam;
  const h = vertical ? letras.length * tam * 1.15 + tam * 0.6 : tam * 1.6;
  ctx.fillStyle = '#0c111c'; rr(x - w / 2 - 3, y - h / 2 - 3, w + 6, h + 6, 3); ctx.fill();
  ctx.fillStyle = aceso ? '#18202e' : '#202838'; rr(x - w / 2, y - h / 2, w, h, 2); ctx.fill();
  ctx.fillStyle = aceso ? cor : rgba(cor, 0.55);
  letras.forEach((l, i) => ctx.fillText(l, x, vertical ? y - h / 2 + tam * 0.9 + i * tam * 1.15 : y + 1));
  ctx.restore();
  if (aceso) { luz(x, y, Math.max(w, h) * 0.9, cor, 0.16); luz(x, 470, Math.max(w, h) * 0.7, cor, 0.06, 0.3); }
}

// a calha das Torres despejando no Mercado: assinatura do bairro
function calha(x, y0, y1) {
  ctx.fillStyle = '#2a3348'; ctx.fillRect(x - 10, 0, 20, y0); ctx.fillRect(x - 18, y0 - 8, 36, 12);
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, 'rgba(190,210,235,0.32)'); g.addColorStop(1, 'rgba(190,210,235,0.10)');
  ctx.fillStyle = g; poli([[x - 8, y0], [x + 8, y0], [x + 18, y1], [x - 18, y1]]); ctx.fill();
  ctx.strokeStyle = 'rgba(225,235,250,0.28)'; ctx.lineWidth = 1.5;
  for (let i = 0; i < 22; i++) { const sx = x + R(-10, 10), sy = R(y0, y1 - 50); ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + R(-2, 2), sy + R(30, 60)); ctx.stroke(); }
  for (let i = 0; i < 40; i++) { const a = R(Math.PI, Math.PI * 2), d = R(4, 50); ctx.fillStyle = rgba('#dfe8f5', R(0.1, 0.4)); ctx.fillRect(x + Math.cos(a) * d * 1.6, y1 + Math.sin(a) * d * 0.5, 2, 2); }
  ctx.fillStyle = 'rgba(190,210,235,0.06)'; ctx.beginPath(); ctx.ellipse(x, y1 + 6, 80, 22, 0, 0, Math.PI * 2); ctx.fill();
}

// poste de sódio: cone de luz no ar e mancha quente no chão
function poste(x, y) {
  ctx.fillStyle = '#0a0e18'; ctx.fillRect(x - 4, y - 260, 8, 260);
  ctx.fillRect(x - 4, y - 262, 56, 7);
  ctx.fillStyle = '#fff1d6'; rr(x + 34, y - 258, 22, 8, 3); ctx.fill();
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  const g = ctx.createLinearGradient(0, y - 250, 0, y + 150);
  g.addColorStop(0, rgba(A.sodio, 0.22)); g.addColorStop(1, rgba(A.sodio, 0));
  ctx.fillStyle = g; poli([[x + 36, y - 252], [x + 54, y - 252], [x + 200, y + 150], [x - 110, y + 150]]); ctx.fill();
  ctx.restore();
  luz(x + 45, y + 120, 300, A.sodio, 0.22, 0.42, 'screen');
  luz(x + 45, y - 254, 40, A.sodio, 0.8);
}

// ── personagens ────────────────────────────────────
// Cada personagem é um esqueleto (juntas em unidades, pés na origem, olhando pra direita)
// vestido peça por peça num canvas próprio. Depois vêm três passadas, as mesmas que o jogo
// fará uma vez por pose e guardará em cache: sombreado na direção da luz, luz de recorte
// quente no lado do poste e contorno escuro de 2 px pra silhueta ler em qualquer chão.
const LUZES = [[475, 216], [1285, 216], [2155, 216]];
function capsula(x1, y1, r1, x2, y2, r2) {
  const p = new Path2D(), a = Math.atan2(y2 - y1, x2 - x1), n = a + Math.PI / 2;
  p.moveTo(x1 + Math.cos(n) * r1, y1 + Math.sin(n) * r1);
  p.lineTo(x2 + Math.cos(n) * r2, y2 + Math.sin(n) * r2);
  p.arc(x2, y2, r2, n, n + Math.PI, true);
  p.lineTo(x1 - Math.cos(n) * r1, y1 - Math.sin(n) * r1);
  p.arc(x1, y1, r1, n + Math.PI, n, true);
  p.closePath(); return p;
}
function forma(pts, curva) {
  const p = new Path2D();
  if (!curva) { pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y))); p.closePath(); return p; }
  // contorno suave: passa pelo meio de cada lado (pano não tem quina)
  const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], n = pts.length;
  const s = m(pts[n - 1], pts[0]); p.moveTo(s[0], s[1]);
  for (let i = 0; i < n; i++) { const q = m(pts[i], pts[(i + 1) % n]); p.quadraticCurveTo(pts[i][0], pts[i][1], q[0], q[1]); }
  p.closePath(); return p;
}
function membro(g, a, b, c, r1, r2, r3, cor) {   // dois segmentos: coxa+canela, braço+antebraço
  g.fillStyle = cor; g.fill(capsula(a[0], a[1], r1, b[0], b[1], r2)); g.fill(capsula(b[0], b[1], r2, c[0], c[1], r3));
}
function bota(g, t, cor, sola, frente = 1) {
  g.fillStyle = cor; g.fill(forma([[t[0] - 9, t[1] - 16], [t[0] + 7, t[1] - 16], [t[0] + 9 + 12 * frente, t[1] - 4], [t[0] + 10 + 13 * frente, t[1] + 2], [t[0] - 10, t[1] + 2]], true));
  g.fillStyle = sola; g.fillRect(t[0] - 11, t[1], 22 + 13 * frente, 4);
}
function mao(g, p, cor) { g.fillStyle = cor; g.beginPath(); g.ellipse(p[0], p[1], 6, 5.5, 0, 0, Math.PI * 2); g.fill(); }
function cabeca(g, h, o) {
  const [x, y] = h;
  g.fillStyle = o.pele; g.fill(capsula(x - 3, y + 10, 6, x - 4, y + 20, 7));            // pescoço
  g.fill(forma([[x - 11, y - 12], [x + 8, y - 14], [x + 13, y - 4], [x + 15, y + 2], [x + 11, y + 4], [x + 9, y + 12], [x, y + 15], [x - 10, y + 9]], true));
  g.fillStyle = 'rgba(0,0,0,0.22)'; g.fill(forma([[x - 4, y + 4], [x + 9, y + 6], [x + 7, y + 13], [x, y + 15], [x - 6, y + 10]], true));   // barba por fazer / sombra do queixo
  g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(x + 5, y - 3, 5, 1.8);                     // olho
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(x + 3, y - 6, 8, 1.6);                     // sobrancelha
  g.fillStyle = 'rgba(0,0,0,0.3)'; g.beginPath(); g.ellipse(x - 4, y - 1, 3, 4.5, 0, 0, Math.PI * 2); g.fill();   // orelha
  if (o.cabelo) { g.fillStyle = o.cabelo; g.fill(forma([[x - 13, y - 4], [x - 12, y - 14], [x - 2, y - 19], [x + 10, y - 16], [x + 13, y - 9], [x + 4, y - 11], [x - 6, y - 8], [x - 8, y + 2]], true)); }
}

function figura(o, desenhar) {
  const S = o.s, LADO = 300, c = document.createElement('canvas');
  c.width = Math.ceil(LADO * S); c.height = Math.ceil(LADO * S);
  const g = c.getContext('2d'), ox = c.width / 2, oy = c.height - 14 * S, f = o.olha || 1;
  g.save(); g.translate(ox, oy); g.scale(S * f, S); g.lineJoin = 'round'; g.lineCap = 'round';
  desenhar(g); g.restore();
  // direção da luz: do personagem pro poste mais perto
  const [lx, ly] = LUZES.reduce((m, l) => (Math.hypot(l[0] - o.x, l[1] - o.y) < Math.hypot(m[0] - o.x, m[1] - o.y) ? l : m));
  let dx = lx - o.x, dy = ly - (o.y - 90 * S); const d = Math.hypot(dx, dy); dx /= d; dy /= d;
  // sombreado: claro do lado da luz, escuro do outro, pé mais escuro que cabeça
  g.globalCompositeOperation = 'source-atop';
  const sg = g.createLinearGradient(ox + dx * 60 * S, oy - 100 * S + dy * 60 * S, ox - dx * 60 * S, oy - 100 * S - dy * 60 * S);
  sg.addColorStop(0, 'rgba(255,214,160,0.16)'); sg.addColorStop(0.5, 'rgba(0,0,0,0)'); sg.addColorStop(1, 'rgba(4,8,20,0.5)');
  g.fillStyle = sg; g.fillRect(0, 0, c.width, c.height);
  const ag = g.createLinearGradient(0, oy - 60 * S, 0, oy); ag.addColorStop(0, 'rgba(4,8,20,0)'); ag.addColorStop(1, 'rgba(4,8,20,0.45)');
  g.fillStyle = ag; g.fillRect(0, 0, c.width, c.height);
  if (o.flash) { g.fillStyle = `rgba(250,240,225,${o.flash})`; g.fillRect(0, 0, c.width, c.height); }
  // luz de recorte: silhueta menos ela mesma deslocada pra longe da luz
  const rim = document.createElement('canvas'); rim.width = c.width; rim.height = c.height;
  const rg = rim.getContext('2d');
  rg.drawImage(c, 0, 0); rg.globalCompositeOperation = 'source-in'; rg.fillStyle = rgba(A.sodio, o.recorte ?? 0.85); rg.fillRect(0, 0, c.width, c.height);
  rg.globalCompositeOperation = 'destination-out'; rg.drawImage(c, -dx * 3.2 * S, -dy * 3.2 * S);
  g.globalCompositeOperation = 'lighter'; g.drawImage(rim, 0, 0);
  // contorno escuro
  const out = document.createElement('canvas'); out.width = c.width + 8; out.height = c.height + 8;
  const og = out.getContext('2d');
  const mask = document.createElement('canvas'); mask.width = c.width; mask.height = c.height;
  const mg = mask.getContext('2d'); mg.drawImage(c, 0, 0); mg.globalCompositeOperation = 'source-in'; mg.fillStyle = '#04060c'; mg.fillRect(0, 0, c.width, c.height);
  for (let a = 0; a < 8; a++) og.drawImage(mask, 4 + Math.cos(a * Math.PI / 4) * 2.2, 4 + Math.sin(a * Math.PI / 4) * 2.2);
  og.drawImage(c, 4, 4);
  // sombra no chão, alongada pra longe da luz
  ctx.save(); ctx.translate(o.x - dx * 14 * S, o.y + 2); ctx.rotate(Math.atan2(-dy, -dx) * 0.15);
  ctx.fillStyle = 'rgba(3,6,14,0.55)'; ctx.beginPath(); ctx.ellipse(0, 0, 42 * S, 12 * S, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.drawImage(out, o.x - ox - 4, o.y - oy - 4);
}

// Faro, Mercenário: sobretudo comprido aberto, cachecol âmbar, ombreira de ex-segurança de carga,
// escopeta de cano serrado na altura do peito. Ainda sem implante: cru.
function faro(x, y, mira) {
  figura({ x, y, s: 1.18, recorte: 0.9 }, g => {
    const pele = '#a87b60', calca = '#1f232d', luva = '#1b1715', casaco = '#2d3444', casacoEsc = '#232938';
    const pB = { q: [-6, -96], j: [-15, -50], t: [-26, -8] }, pF = { q: [6, -95], j: [17, -50], t: [24, -8] };
    // aba de trás do sobretudo, varrida pelo passo
    g.fillStyle = casacoEsc; g.fill(forma([[-16, -132], [-4, -100], [-6, -60], [-22, -34], [-40, -40], [-30, -80]], true));
    membro(g, pB.q, pB.j, pB.t, 10, 8, 6.5, calca); bota(g, pB.t, '#16120f', '#0a0806', 1);
    // braço de trás segurando a telha da escopeta
    membro(g, [-6, -146], [16, -130], [40, -128], 7.5, 6.5, 5.5, casacoEsc);
    membro(g, pF.q, pF.j, pF.t, 10, 8, 6.5, calca); bota(g, pF.t, '#16120f', '#0a0806', 1);
    // tronco do sobretudo, aberto na frente
    g.fillStyle = casaco; g.fill(forma([[-12, -154], [10, -156], [20, -146], [22, -120], [16, -98], [30, -42], [10, -36], [4, -70], [-6, -40], [-18, -60], [-16, -100], [-18, -140]], true));
