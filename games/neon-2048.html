<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NEON 2048 — Arcade</title>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#04001a">
<link rel="stylesheet" href="../assets/css/neon-theme.css">
<style>
  .stage { --arw: 1; --arh: 1; --maxw: 500px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <a href="../index.html"><h1>NEON 2048</h1></a>
      <div class="tag">// | Combine os blocos até 2048 | <a href="../index.html" style="color:var(--neon-cyan)">arcade</a></div>
    </div>
  </header>

  <div class="dashboard" style="--dash-cols:2;">
    <div class="stat"><span class="lbl">Score</span><span class="val" id="score">0</span></div>
    <div class="stat"><span class="lbl">Best</span><span class="val" id="best" data-key="2048">0</span></div>
  </div>

  <div class="stage" id="stage">
    <button class="sound-toggle" id="soundToggle" title="Som">🔊</button>
    <button class="pause-toggle" id="pauseToggle" title="Pausa (P)">⏸</button>
    <div class="toast" id="toast">2048!</div>
    <canvas id="game" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">NEON 2048</h2>
      <p id="overlayText">Deslize para fundir blocos iguais e multiplique por 2. Alcance o 2048 — e continue se quiser.</p>
      <div class="sub" id="overlaySub"></div>
      <div class="final-stats" id="finalStats" style="display:none;">
        <div class="fstat"><span>Score</span><b id="fsScore">0</b></div>
        <div class="fstat"><span>Maior bloco</span><b id="fsBig">2</b></div>
        <div class="fstat"><span>Jogadas</span><b id="fsMoves">0</b></div>
      </div>
      <button class="btn" id="startBtn">START</button>
      <div class="controls-hint">
        <span class="key">← ↑ → ↓</span><span class="key">WASD</span><span class="key">Swipe</span><span class="key">P pausa</span>
      </div>
    </div>
  </div>

  <footer>// <a href="../index.html">← arcade</a> · 90% das novas peças são 2 · alcance 2048 para vencer</footer>
</div>

<script src="../assets/js/neon-core.js"></script>
<script>
(() => {
  'use strict';
  const Neon = window.Neon;
  const canvas = Neon.$('game'), ctx = canvas.getContext('2d');
  const N = 4, SIZE = 480, CELL = SIZE / N, PAD = 8;
  const ANIM_MS = 110;

  const els = {
    score: Neon.$('score'), best: Neon.$('best'),
    fsScore: Neon.$('fsScore'), fsBig: Neon.$('fsBig'), fsMoves: Neon.$('fsMoves'), stage: Neon.$('stage'),
  };

  let grid = [], from = [], score = 0, pb = 0, startHi = 0;
  let anim = { t: 0, active: false, merged: [] };
  let moves = 0, state = 'menu', lastFrame = performance.now();
  let lastKey = 0, flash = { t: 0, color: '' };
  const particles = new Neon.Particles();
  pb = Neon.best.get('2048');

  const empty = () => Array.from({ length: N }, () => Array(N).fill(0));
  const copy = g => g.map(r => [...r]);

  function spawnTile() {
    const cells = [];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!grid[y][x]) cells.push([x, y]);
    if (!cells.length) return;
    const [x, y] = Neon.choice(cells);
    grid[y][x] = Math.random() < 0.9 ? 2 : 4;
    from[y][x] = { x, y };
  }

  function newGame() {
    grid = empty();
    from = empty().map(row => row.map(() => null));
    score = 0; moves = 0;
    anim = { t: 0, active: false, merged: [] };
    particles.clear();
    spawnTile();
    spawnTile();
    els.score.textContent = '0';
  }

  const hueOf = v => (140 + Math.log2(v) * 36) % 360;

  function move(dir) {
    // 0=up 1=right 2=down 3=left
    const fromGrid = empty().map(row => row.map(() => null));
    const merged = [];
    let moved = false, gained = 0;

    const cellAt = (i, j) => { // percorre na direção do movimento
      if (dir === 0) return [j, i];       // coluna i, de cima pra baixo
      if (dir === 2) return [N - 1 - j, i];
      if (dir === 1) return [i, N - 1 - j];
      return [i, j];
    };

    for (let i = 0; i < N; i++) {
      const cells = [];
      for (let j = 0; j < N; j++) {
        const [y, x] = cellAt(i, j);
        if (grid[y][x]) cells.push({ y, x, val: grid[y][x] });
      }
      const out = [];
      for (const c of cells) {
        const last = out[out.length - 1];
        if (last && last.val === c.val) {
          last.val *= 2;
          gained += last.val;
          moved = true;
          merged.push([last.y, last.x]);
        } else {
          out.push({ ...c });
        }
      }
      for (let j = 0; j < N; j++) {
        const [y, x] = cellAt(i, j);
        const v = j < out.length ? out[j].val : 0;
        if (grid[y][x] !== v) moved = true;
        grid[y][x] = v;
        fromGrid[y][x] = j < out.length ? { x: out[j].x, y: out[j].y } : null;
      }
    }

    if (!moved) return;
    from = fromGrid;
    score += gained;
    moves++;
    anim = { t: performance.now(), active: true, merged };
    Neon.popEl(els.score);
    els.score.textContent = score;
    els.best.textContent = Math.max(pb, score);
    if (gained) Neon.audio.sfx.merge(Math.max(4, gained));
    else Neon.audio.sfx.click();
    spawnTile();
    setTimeout(() => { anim.active = false; }, ANIM_MS + 50);
    checkEnd();
  }

  function canMove() {
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        if (!grid[y][x]) return true;
        if (x + 1 < N && grid[y][x] === grid[y][x + 1]) return true;
        if (y + 1 < N && grid[y][x] === grid[y + 1][x]) return true;
      }
    }
    return false;
  }

  function checkEnd() {
    const big = Math.max(0, ...grid.flat());
    if (big === 2048 && state !== 'playing-won') {
      state = 'playing-won';
      Neon.toast('🏆 2048! Continue se quiser.');
      Neon.audio.sfx.record();
      if (!Neon.motion.reduced) flash = { t: 400, color: 'rgba(255, 215, 0,' };
    }
    if (!canMove()) gameOver(big);
  }

  function gameOver(big) {
    state = 'gameover';
    Neon.audio.music.down();
    Neon.best.update('2048', score);
    els.best.textContent = Neon.best.get('2048');
    const isRecord = startHi === 0 ? score > 0 : score > startHi;
    if (isRecord) Neon.audio.sfx.record(); else Neon.audio.sfx.death();
    els.fsScore.textContent = score;
    els.fsBig.textContent = big;
    els.fsMoves.textContent = moves;
    Neon.$('finalStats').style.display = 'grid';
    Neon.overlay.show(isRecord ? 'NOVO RECORDE!' : 'GRID CHEIO',
      `O maior bloco foi ${big} em ${moves} jogadas.`,
      'JOGAR DE NOVO', isRecord ? 'record' : 'go');
  }

  function startGame() {
    Neon.audio.ensure();
    startHi = pb;
    newGame();
    state = 'playing';
    Neon.overlay.hide();
    Neon.audio.music.start();
  }
  function pauseGame() {
    state = 'paused';
    Neon.audio.sfx.pause();
    Neon.audio.music.stop();
    Neon.overlay.show('PAUSADO', 'Aperte P para continuar.', 'RESUME');
  }
  function resumeGame() {
    state = 'playing';
    Neon.overlay.hide();
    Neon.audio.music.start();
  }

  // ── input ─────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === ' ' || k === 'Enter') {
      e.preventDefault();
      if (state === 'menu' || state === 'gameover') startGame();
      else if (state === 'paused') resumeGame();
      return;
    }
    if (k === 'p' || k === 'P') {
      if (state === 'playing' || state === 'playing-won') pauseGame();
      else if (state === 'paused') resumeGame();
      return;
    }
    if (state !== 'playing') return;
    const key = k.toLowerCase();
    if (key.startsWith('arrow') || ['w', 'a', 's', 'd'].includes(key)) {
      e.preventDefault();
      const t = performance.now();
      if (t - lastKey < 120) return;
      lastKey = t;
      if (key === 'arrowup' || key === 'w') move(0);
      else if (key === 'arrowright' || key === 'd') move(1);
      else if (key === 'arrowdown' || key === 's') move(2);
      else move(3);
    }
  });

  let swipeStart = null;
  els.stage.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.sound-toggle')) return;
    swipeStart = { x: e.clientX, y: e.clientY };
  });
  els.stage.addEventListener('pointerup', (e) => {
    if (!swipeStart) { swipeStart = null; return; }
    const dx = e.clientX - swipeStart.x, dy = e.clientY - swipeStart.y;
    swipeStart = null;
    if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
    if (state === 'menu' || state === 'gameover') { startGame(); return; }
    if (state !== 'playing') return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : 3);
    else move(dy > 0 ? 2 : 0);
  });

  Neon.$('startBtn').addEventListener('click', () => {
    if (state === 'paused') resumeGame();
    else startGame();
  });
  Neon.onHide(() => { if (state === 'playing' || state === 'playing-won') pauseGame(); });

  // ── render ────────────────────────────────────────
  function drawTile(x, y, val, scale = 1, alpha = 1) {
    const px = x * CELL + PAD, py = y * CELL + PAD;
    const s = (CELL - PAD * 2) * scale;
    const cx = px + (CELL - PAD * 2) / 2, cy = py + (CELL - PAD * 2) / 2;
    const hue = hueOf(val);
    ctx.globalAlpha = alpha;
    const g = ctx.createRadialGradient(cx - s * 0.15, cy - s * 0.2, 2, cx, cy, s / 1.3);
    g.addColorStop(0, `hsl(${hue}, 100%, ${Math.min(88, 66 + Math.log2(val) * 2)}%)`);
    g.addColorStop(1, `hsl(${hue}, 100%, 52%)`);
    ctx.fillStyle = g;
    Neon.glow(ctx, `hsl(${hue}, 100%, 60%)`, Math.min(22, 6 + Math.log2(val) * 2.2));
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(cx - s / 2, cy - s / 2, s, s, 10) : ctx.rect(cx - s / 2, cy - s / 2, s, s);
    ctx.fill();
    ctx.shadowBlur = 0;
    if (val >= 4) {
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.rect(cx - s / 2 + 3, cy - s / 2 + 3, s - 6, s - 6);
      ctx.stroke();
    }
    ctx.fillStyle = val >= 128 ? 'rgba(255,255,255,0.95)' : 'rgba(10,0,40,0.75)';
    ctx.font = `900 ${val >= 1024 ? 26 : val >= 128 ? 34 : 40}px Orbitron, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(val, cx, cy + 1);
    ctx.globalAlpha = 1;
  }

  function render(now) {
    ctx.fillStyle = '#05001a';
    ctx.fillRect(0, 0, SIZE, SIZE);
    const g = ctx.createRadialGradient(SIZE / 2, SIZE / 2, 0, SIZE / 2, SIZE / 2, 360);
    g.addColorStop(0, 'rgba(80, 0, 160, 0.32)');
    g.addColorStop(1, 'rgba(4, 0, 26, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SIZE, SIZE);

    ctx.fillStyle = 'rgba(155, 48, 255, 0.07)';
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(x * CELL + PAD, y * CELL + PAD, CELL - PAD * 2, CELL - PAD * 2, 10) : ctx.rect(x * CELL + PAD, y * CELL + PAD, CELL - PAD * 2, CELL - PAD * 2);
        ctx.fill();
      }
    }

    let prog = 1;
    if (anim.active) {
      prog = Math.min(1, (now - anim.t) / ANIM_MS);
      if (prog >= 1) anim.active = false;
    }

    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const val = grid[y][x];
        if (!val) continue;
        const o = (from[y] && from[y][x]) || { x, y };
        const isNew = !(from[y] && from[y][x]) && anim.active;
        const lx = o.x + (x - o.x) * prog;
        const ly = o.y + (y - o.y) * prog;
        const scale = isNew ? 0.4 + prog * 0.6 : 1;
        drawTile(lx, ly, val, scale);
      }
    }

    if (anim.active && anim.merged.length) {
      ctx.globalAlpha = Math.max(0, 1 - prog) * 0.75;
      ctx.fillStyle = '#ffffff';
      for (const [my, mx] of anim.merged) {
        ctx.fillRect(mx * CELL + PAD, my * CELL + PAD, CELL - PAD * 2, CELL - PAD * 2);
      }
      ctx.globalAlpha = 1;
    }

    particles.draw(ctx);

    if (flash.t > 0) {
      ctx.fillStyle = `${flash.color} ${Math.min(0.4, flash.t / 300)})`;
      ctx.fillRect(0, 0, SIZE, SIZE);
    }
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    if (state === 'playing' || state === 'playing-won') particles.update(dt);
    if (flash.t > 0) flash.t -= dt * 1000;
    render(now);
    requestAnimationFrame(loop);
  }

  newGame();
  render(performance.now());
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
